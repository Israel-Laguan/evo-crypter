name: Update Version on PR to Main

on:
  pull_request:
    types: [closed]
    branches: [ "main", "dev" ]

jobs:
  if_merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ The PR was merged"

  update-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get current version
        id: get_version
        run: |
          version=$(tr -d '\n' < version.txt)
          echo "Detected version: '$version'"
          echo "current_version=$version" >> $GITHUB_OUTPUT

      - name: Update version based on branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"

          echo "Base: $BASE_REF | Head: $HEAD_REF"

          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

          CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"

          if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "dev" ]]; then
            NEW_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{ $2 += 1; $3 = 0; print }' OFS=".")
          elif [[ "$BASE_REF" == "main" && "$HEAD_REF" =~ ^release/.* ]]; then
            NEW_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{ $1 += 1; $2 = $3 = 0; print }' OFS=".")
          elif [[ "$BASE_REF" == "main" && "$HEAD_REF" =~ ^hotfix/.* ]]; then
            NEW_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{ $NF += 1; print }' OFS=".")
          elif [[ "$BASE_REF" == "dev" ]]; then
            NEW_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{ $NF += 1; print }' OFS=".")
          else
            echo "❌ No matching condition for version bump."
            exit 0
          fi

          ./scripts/update_version.sh "$NEW_VERSION"

          git add version.txt
          git commit -m "chore: Bump version to $NEW_VERSION"
          git push origin HEAD:"$HEAD_REF"
