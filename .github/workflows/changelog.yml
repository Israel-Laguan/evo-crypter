name: Changelog CI

on:
  push:
    branches:
      - dev
      - main
      - feat/automate-changelog-generation

  pull_request:
    types: [opened]

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Set Release Version'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v3

      - name: 🧪 Log context info
        run: |
          echo "🔹 github.ref: ${{ github.ref }}"
          echo "🔹 github.event_name: ${{ github.event_name }}"
          echo "🔹 github.sha: ${{ github.sha }}"
          echo "🔹 github.actor: ${{ github.actor }}"
          echo "🔹 release_version (if provided): ${{ github.event.inputs.release_version }}"

      - name: 📝 Run Changelog CI
        uses: saadmk11/changelog-ci@v1.1.2
        with:
          changelog_filename: CHANGELOG.md
          config_file: .changelog-config.yml
          committer_username: 'github-actions[bot]'
          committer_email: 'github-actions[bot]@users.noreply.github.com'
          release_version: ${{ github.event.inputs.release_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Commit and push changelog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "🔹 Git status before commit:"
          git status
          git add CHANGELOG.md
          git commit -m "chore: update changelog for release ${{ github.event.inputs.release_version }}" || echo "⚠️ Nothing to commit"
          echo "🔹 Pushing changes to: ${{ github.ref }}"
          git push origin HEAD
