name: Push Checks

on:
  push:
    paths:
      - '**/*.c'
      - '**/*.h'
    branches-ignore:
      - main

jobs:
  lint-test-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for existing PRs
        id: check_pr
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`
            });
            if (prs.data.length > 0) {
              console.log('An open PR already exists for this branch. Skipping push checks.');
            }

            core.setOutput('pr_exists', prs.data.length > 0);

      - name: Checkout code
        if: steps.check_pr.outputs.pr_exists == 'false'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Dependencies
        if: steps.check_pr.outputs.pr_exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcmocka-dev clang clang-tidy clang-format cppcheck

      - name: Run linter
        if: steps.check_pr.outputs.pr_exists == 'false'
        run: ./scripts/lint.sh 2> lint-errors.txt || echo "found_lint_errors=true" >> $GITHUB_ENV

      - name: Build project (Debug) and Run tests
        if: steps.check_pr.outputs.pr_exists == 'false'
        run: ./scripts/test.sh 2> test-errors.txt || echo "found_test_errors=true" >> $GITHUB_ENV

      - name: Comment PR with errors
        if: env.found_lint_errors == 'true' || env.found_test_errors == 'true'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ## ❌ Push Checks Failed:
            ${{
              env.found_lint_errors == 'true' && '### Linter Errors:\n```\n' + steps.linter_output.outputs.errors + '\n```'
            }}
            ${{
              env.found_test_errors == 'true' && '### Test Errors:\n```\n' + steps.test_output.outputs.errors + '\n```'
            }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
