name: Changelog CI

on:
  push:
    branches:
      - dev
      - main
      - feat/automate-changelog-generation

  pull_request:
    types: [opened]

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Set Release Version'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v3

      - name: 📥 Get current version from file
        id: get_version
        run: |
          VERSION=$(cat version.txt)
          echo "🔹 Found version in version.txt: $VERSION"
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🧪 Log context info
        run: |
          echo "🔹 github.ref: ${{ github.ref }}"
          echo "🔹 github.event_name: ${{ github.event_name }}"
          echo "🔹 github.sha: ${{ github.sha }}"
          echo "🔹 github.actor: ${{ github.actor }}"
          echo "🔹 release_version (input): ${{ github.event.inputs.release_version }}"
          echo "🔹 release_version (from file): ${{ steps.get_version.outputs.current_version }}"

      - name: 📝 Run Changelog CI
        uses: saadmk11/changelog-ci@v1.1.2
        with:
          changelog_filename: CHANGELOG.md
          config_file: .changelog-config.yml
          committer_username: 'github-actions[bot]'
          committer_email: 'github-actions[bot]@users.noreply.github.com'
          release_version: ${{ github.event.inputs.release_version || steps.get_version.outputs.current_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_git_push: false
          create_pr: false
          commit_changelog: true
          git_branch: ${{ github.head_ref || github.ref_name }}

      - name: 📦 Commit and push changelog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "🔹 Git status before commit:"
          git status
          git add CHANGELOG.md
          git commit -m "chore: update changelog for release ${{ github.event.inputs.release_version || steps.get_version.outputs.current_version }}" || echo "⚠️ Nothing to commit"
          echo "🔹 Pushing changes to: ${{ github.ref }}"
          git push origin HEAD
